<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Administrar usuarios | VFeria</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --surface: #151d32;
      --input-bg: #0b1223;
      --border: #34425f;
      --text: #f1f5ff;
      --muted: #b0bcd3;
      --label: #c2cce0;
      --cyan: #08bdf5;
      --purple: #8b3dff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #192443 0%, transparent 58%),
        var(--bg);
      border-top: 5px solid #570e25;
    }

    .admin-container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 34px;
      background: var(--surface);
      border: 1px solid #293650;
      border-radius: 16px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.24);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      color: #9bbcff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .back-button:hover {
      color: var(--cyan);
    }

    .back-button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
      border-radius: 3px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #91a8ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--text);
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.2;
    }

    .description {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 16px;
    }

    .field {
      min-width: 0;
    }

    .field.full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: var(--label);
      font-size: 13px;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 11px 13px;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:hover {
      border-color: #53658b;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(8, 189, 245, 0.12);
    }

    input::placeholder {
      color: #71809d;
    }

    .help-text {
      margin: 22px 0 18px;
      color: #a6b3cc;
      font-size: 12px;
      line-height: 1.65;
    }

    #createButton {
      min-height: 44px;
      padding: 12px 20px;
      color: #fff;
      background: linear-gradient(110deg, var(--cyan), var(--purple));
      border: 0;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(63, 100, 255, 0.17);
      transition: filter 0.2s, transform 0.2s;
    }

    #createButton:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    #createButton:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    #createButton:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    #status {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #status:empty {
      display: none;
    }

    #status.error {
      color: #ff9ca8;
    }

    #status.success {
      color: #79e6bd;
    }

    @media (max-width: 560px) {
      body {
        padding: 16px 12px;
      }

      .admin-container {
        padding: 24px 18px;
        border-radius: 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .field.full-width {
        grid-column: auto;
      }

      #createButton {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="admin-container">

    <a href="panel.html" class="back-button">
      ← Volver al panel de emprendedores
    </a>

    <p class="eyebrow">Gestión privada</p>

    <h1>Administrar usuarios</h1>

    <p class="description">
      Crea una cuenta para un emprendimiento. El registro público no está habilitado.
    </p>

    <form id="adminCreateForm">
      <div class="form-grid">

        <div class="field">
          <label for="username">Nombre de usuario</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="off"
            required
          >
        </div>

        <div class="field">
          <label for="password">Contraseña inicial</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="14"
            required
          >
        </div>

        <div class="field full-width">
          <label for="businessName">Nombre del emprendimiento</label>
          <input
            id="businessName"
            name="businessName"
            type="text"
            required
          >
        </div>

        <div class="field">
          <label for="email">Correo electrónico (opcional)</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label for="phone">Teléfono (opcional)</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
          >
        </div>

        <div class="field full-width">
          <label for="city">Ciudad (opcional)</label>
          <input
            id="city"
            name="city"
            type="text"
            autocomplete="address-level2"
          >
        </div>

      </div>

      <p class="help-text">
        Usa una contraseña única de al menos 14 caracteres.
        Entrégala al emprendedor de forma privada.
      </p>

      <button id="createButton" type="submit">
        Crear cuenta
      </button>

      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="admin.js"></script>
</body>
</html>
