<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrar usuarios | VFeria</title><link rel="stylesheet" href="styles.css"><style>
.admin-shell{max-width:780px;margin:48px auto;padding:24px}.admin-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;box-shadow:0 8px 30px #1018280d}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.admin-grid .full{grid-column:1/-1}.admin-grid label{display:block;font-weight:600;margin-bottom:6px}.admin-grid input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}.admin-message{min-height:24px;margin-top:16px}.admin-back{display:inline-block;margin-bottom:18px}@media(max-width:600px){.admin-grid{grid-template-columns:1fr}.admin-grid .full{grid-column:auto}.admin-shell{padding:16px;margin:20px auto}}
</style></head><body class="dashboard-page"><main class="admin-shell"><a class="admin-back" href="panel.html">← Volver al panel</a><section class="admin-card"><span class="eyebrow">GESTIÓN PRIVADA</span><h1>Administrar usuarios</h1><p class="muted">Crea una cuenta para un emprendimiento. El registro público no está habilitado.</p><form id="createUserForm" hidden><div class="admin-grid"><div><label for="username">Nombre de usuario</label><input id="username" name="username" minlength="3" maxlength="60" autocomplete="off" required></div><div><label for="password">Contraseña inicial</label><input id="password" name="password" type="password" minlength="14" autocomplete="new-password" required></div><div class="full"><label for="businessName">Nombre del emprendimiento</label><input id="businessName" name="businessName" maxlength="150" required></div><div><label for="email">Correo electrónico (opcional)</label><input id="email" name="email" type="email"></div><div><label for="phone">Teléfono (opcional)</label><input id="phone" name="phone" type="tel"></div><div class="full"><label for="city">Ciudad (opcional)</label><input id="city" name="city" maxlength="100"></div></div><p class="muted">Usa una contraseña única de al menos 14 caracteres. Entrégala al emprendedor de forma privada.</p><button class="btn btn-primary" id="createButton" type="submit">Crear cuenta</button><p id="adminMessage" class="admin-message" role="status" aria-live="polite"></p></form><p id="checkingMessage" role="status">Verificando sesión y permisos…</p></section></main><script src="admin.js"></script></body></html>
